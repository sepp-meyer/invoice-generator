<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <title>{% block title %}Invoice Explorer{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; margin: 2rem; max-width: 980px; }
    h1   { margin: 0 0 1rem; }
    form { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin: 0 0 1rem; }
    input[type=text]{ padding:.55rem .7rem; border:1px solid #bbb; border-radius:6px; min-width:260px }
    button{ padding:.55rem .9rem; border:1px solid #005091; background:#006bb3; color:#fff; border-radius:6px; cursor:pointer }
    button:hover{ background:#005091 }
    .hr  { height:1px; background:#eee; margin:1rem 0 }
    .muted { color:#666; }
    pre  { background:#f8f8f8; padding:12px; border:1px solid #e2e2e2; border-radius:6px; overflow:auto; }
    .kv  { display:grid; grid-template-columns: 220px 1fr; gap:.3rem .8rem; align-items:start; }
    .key { color:#444; }
    .box { border:1px solid #e5e5e5; border-radius:8px; padding:12px; }
    .err { border-color:#d9534f; background:#fff5f5; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
